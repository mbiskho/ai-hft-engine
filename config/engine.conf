# hft-engine configuration. Unknown keys are rejected at startup.
# Prices are in ticks and quantities in lots (config/symbols.conf has the sizes).

strategy.buy_threshold    = 0.62
strategy.sell_threshold   = 0.38
strategy.order_qty        = 10        # lots (BTCUSDT lot 0.00001 -> 0.0001 BTC)
strategy.cooldown_ms      = 250
strategy.aggression_ticks = 1

risk.max_order_qty        = 50
risk.max_position         = 200
risk.max_notional         = 2.0e9     # |position| * mid, ticks*lots
risk.price_collar_bps     = 15
risk.max_orders_per_sec   = 20
risk.max_drawdown         = 5.0e6     # from PnL high-water mark, ticks*lots

exec.latency_us           = 250       # simulated decision -> exchange
exec.fee_bps              = 1.0
